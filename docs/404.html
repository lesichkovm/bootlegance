<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — Bootlegance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            color: #0f172a;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .error-card {
            border: 2px solid #0f172a;
            box-shadow: 6px 6px 0px 0px #0f172a;
            background: white;
            padding: 3rem 2rem;
            max-width: 480px;
            width: 100%;
        }
        .btn-home {
            background-color: #4f46e5;
            color: white;
            border: 2px solid #0f172a;
            box-shadow: 2px 2px 0px 0px #0f172a;
            font-weight: bold;
            border-radius: 0;
            padding: 0.75rem 1.5rem;
            text-decoration: none;
            display: inline-block;
        }
        .btn-home:hover {
            background-color: #4338ca;
            color: white;
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px 0px #0f172a;
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="error-card">
            <h1 class="display-1 fw-bold">404</h1>
            <h2 class="h4 fw-bold mb-3">Page Not Found</h2>
            <p class="text-muted mb-4">The page or theme preview you are looking for doesn't exist or has moved.</p>
            <a href="index.html" class="btn-home">Back to Theme Gallery</a>
        </div>
    </div>
</body>
</html>
